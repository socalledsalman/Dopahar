name: Build Dopahar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor, Plugins & Offline Fonts
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/local-notifications @capacitor/filesystem @capacitor/share @capacitor/status-bar
          npm install @fontsource-variable/inter @fontsource-variable/plus-jakarta-sans @fontsource-variable/jetbrains-mono @fontsource-variable/geist || true

      - name: Bundle Offline Fonts into www/fonts
        run: |
          mkdir -p www/fonts
          if [ -f index.html ] && [ ! -f www/index.html ]; then cp index.html www/index.html; fi
          python3 - << 'PYEOF'
          import glob, shutil, os
          mapping = {
            "inter.woff2": "node_modules/@fontsource-variable/inter/files/*latin-wght-normal.woff2",
            "geist.woff2": "node_modules/@fontsource-variable/geist/files/*latin-wght-normal.woff2",
            "jakarta.woff2": "node_modules/@fontsource-variable/plus-jakarta-sans/files/*latin-wght-normal.woff2",
            "mono.woff2": "node_modules/@fontsource-variable/jetbrains-mono/files/*latin-wght-normal.woff2"
          }
          for dest, pattern in mapping.items():
            matches = glob.glob(pattern)
            if matches:
              shutil.copy(matches[0], os.path.join("www/fonts", dest))
              print("Bundled", dest)
          PYEOF

      - name: Ensure Capacitor config exists
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dayflow.app",
            "appName": "Dopahar",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          fi

      - name: Add Android platform & sync plugins
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Native Detox (Screen Pinning) & Biometric (Fingerprint) Plugins
        run: |
          PKG_DIR="android/app/src/main/java/com/dayflow/app"
          mkdir -p "$PKG_DIR"
          cat << 'EOF' > "$PKG_DIR/DetoxPlugin.java"
          package com.dayflow.app;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Context;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Detox")
          public class DetoxPlugin extends Plugin {
              @PluginMethod
              public void startPinning(PluginCall call) {
                  Activity activity = getActivity();
                  if (activity == null) { call.reject("No activity"); return; }
                  activity.runOnUiThread(() -> {
                      try {
                          activity.startLockTask();
                          JSObject ret = new JSObject();
                          ret.put("pinned", true);
                          call.resolve(ret);
                      } catch (Exception e) {
                          call.reject("Pinning failed: " + e.getMessage());
                      }
                  });
              }

              @PluginMethod
              public void stopPinning(PluginCall call) {
                  Activity activity = getActivity();
                  if (activity == null) { call.reject("No activity"); return; }
                  activity.runOnUiThread(() -> {
                      try { activity.stopLockTask(); } catch (Exception ignored) {}
                      JSObject ret = new JSObject();
                      ret.put("pinned", false);
                      call.resolve(ret);
                  });
              }

              @PluginMethod
              public void isPinned(PluginCall call) {
                  Activity activity = getActivity();
                  boolean pinned = false;
                  if (activity != null) {
                      ActivityManager am = (ActivityManager) activity.getSystemService(Context.ACTIVITY_SERVICE);
                      if (am != null) pinned = am.getLockTaskModeState() != ActivityManager.LOCK_TASK_MODE_NONE;
                  }
                  JSObject ret = new JSObject();
                  ret.put("pinned", pinned);
                  call.resolve(ret);
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/BiometricPlugin.java"
          package com.dayflow.app;

          import androidx.annotation.NonNull;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.fragment.app.FragmentActivity;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.concurrent.Executor;

          @CapacitorPlugin(name = "Biometric")
          public class BiometricPlugin extends Plugin {
              @PluginMethod
              public void isAvailable(PluginCall call) {
                  FragmentActivity activity = getActivity();
                  if (activity == null) { call.reject("No activity"); return; }
                  BiometricManager bm = BiometricManager.from(activity);
                  int can = bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK);
                  JSObject ret = new JSObject();
                  ret.put("available", can == BiometricManager.BIOMETRIC_SUCCESS);
                  call.resolve(ret);
              }

              @PluginMethod
              public void authenticate(PluginCall call) {
                  FragmentActivity activity = getActivity();
                  if (activity == null) { call.reject("No activity"); return; }
                  String title = call.getString("title", "Unlock Dopahar");
                  String subtitle = call.getString("subtitle", "Verify your identity");
                  activity.runOnUiThread(() -> {
                      Executor executor = ContextCompat.getMainExecutor(activity);
                      BiometricPrompt prompt = new BiometricPrompt(activity, executor, new BiometricPrompt.AuthenticationCallback() {
                          @Override
                          public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult result) {
                              super.onAuthenticationSucceeded(result);
                              JSObject ret = new JSObject();
                              ret.put("authenticated", true);
                              call.resolve(ret);
                          }

                          @Override
                          public void onAuthenticationError(int errorCode, @NonNull CharSequence errString) {
                              super.onAuthenticationError(errorCode, errString);
                              call.reject(errString.toString());
                          }

                          @Override
                          public void onAuthenticationFailed() {
                              super.onAuthenticationFailed();
                          }
                      });
                      BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle(title)
                          .setSubtitle(subtitle)
                          .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK)
                          .setNegativeButtonText("Use PIN")
                          .build();
                      prompt.authenticate(info);
                  });
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.dayflow.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DetoxPlugin.class);
                  registerPlugin(BiometricPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Update App Name, Adaptive Logo, Permissions, Dependencies & Version v1.4
        run: |
          python3 - << 'PYEOF'
          import os, re, glob, textwrap

          # 1. Android display name -> Dopahar (keeps com.dayflow.app appId for in-place upgrade)
          st_path = "android/app/src/main/res/values/strings.xml"
          if os.path.exists(st_path):
              st = open(st_path).read()
              st = re.sub(r'(<string name="app_name">).*?(</string>)', r'\1Dopahar\2', st)
              st = re.sub(r'(<string name="title_activity_main">).*?(</string>)', r'\1Dopahar\2', st)
              open(st_path, "w").write(st)

          # 2. Clean geometric Dopahar Adaptive Launcher Icon (AMOLED black + crisp white midday sun)
          res_dir = "android/app/src/main/res"
          for old_fg in glob.glob(os.path.join(res_dir, "drawable*", "ic_launcher_foreground.*")):
              os.remove(old_fg)
          os.makedirs(os.path.join(res_dir, "drawable"), exist_ok=True)
          os.makedirs(os.path.join(res_dir, "mipmap-anydpi-v26"), exist_ok=True)

          bg_xml = textwrap.dedent('''\
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
              </vector>
          ''')
          fg_xml = textwrap.dedent('''\
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path
                      android:pathData="M30,66 L78,66"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="4.2"
                      android:strokeLineCap="round"/>
                  <path
                      android:pathData="M39,66 A15,15 0 0,1 69,66"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="4.2"
                      android:strokeLineCap="round"
                      android:fillColor="#00000000"/>
                  <path
                      android:pathData="M54,32 L54,42"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="4.2"
                      android:strokeLineCap="round"/>
                  <path
                      android:pathData="M36,41 L42.5,47.5"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="4.2"
                      android:strokeLineCap="round"/>
                  <path
                      android:pathData="M72,41 L65.5,47.5"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="4.2"
                      android:strokeLineCap="round"/>
              </vector>
          ''')
          adaptive_xml = textwrap.dedent('''\
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background"/>
                  <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              </adaptive-icon>
          ''')
          open(os.path.join(res_dir, "drawable", "ic_launcher_background.xml"), "w").write(bg_xml)
          open(os.path.join(res_dir, "drawable", "ic_launcher_foreground.xml"), "w").write(fg_xml)
          open(os.path.join(res_dir, "mipmap-anydpi-v26", "ic_launcher.xml"), "w").write(adaptive_xml)
          open(os.path.join(res_dir, "mipmap-anydpi-v26", "ic_launcher_round.xml"), "w").write(adaptive_xml)

          # 3. Manifest permissions
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n'
          if "USE_BIOMETRIC" not in s:
              if "POST_NOTIFICATIONS" not in s:
                  s = s.replace("<application", perms + "    <application", 1)
              else:
                  s = s.replace("<application", '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
              open(p, "w").write(s)

          # 4. Version bump (4 / v1.4) + Biometric & Kotlin BOM dependencies
          g = "android/app/build.gradle"
          gs = open(g).read()
          gs = re.sub(r'versionCode\s+\d+', 'versionCode 4', gs)
          gs = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.4"', gs)
          if "androidx.biometric:biometric" not in gs:
              gs = gs.replace("dependencies {", "dependencies {\n    implementation 'androidx.biometric:biometric:1.1.0'", 1)
          if "kotlin-bom" not in gs:
              gs = gs.replace("dependencies {", "dependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')", 1)
          open(g, "w").write(gs)
          PYEOF

      - name: Build APK (Signed Release if Keystore Secret exists, else Debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            cp app/build/outputs/apk/release/app-release.apk ../Dopahar-v1.4.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Dopahar-v1.4.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopahar-v1.4-APK
          path: Dopahar-v1.4.apk
